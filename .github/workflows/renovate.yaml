name: Renovate

on:
  schedule:
    - cron: '*/15 * * * *' 
  workflow_dispatch:         # optional: lets you run the workflow manually for testing

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
